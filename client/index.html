<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Spica - ActivityPub でつながる分散型ソーシャルネットワーク" />
    <meta name="theme-color" content="#F4F5FA" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <!-- PWA（ホーム画面に追加） -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spica" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="alternate" type="application/rss+xml" title="Spica" href="/feed.xml" />
    <title>Spica</title>
    <script>
      // 保存されたテーマを最初の描画前に当てる（ちらつき防止）
      try {
        var t = localStorage.getItem('spica_theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
